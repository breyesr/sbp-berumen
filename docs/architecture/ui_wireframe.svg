<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#0A0A0A"/>
  
  <!-- Sidebar (Collapsed) -->
  <rect x="0" y="0" width="64" height="800" fill="#141415" stroke="#27272A" stroke-width="1"/>
  <circle cx="32" cy="40" r="16" fill="#b8975a"/> <!-- Logo Placeholder -->
  <rect x="16" y="100" width="32" height="32" rx="8" fill="#27272A"/>
  <rect x="16" y="150" width="32" height="32" rx="8" fill="#27272A"/>
  <rect x="16" y="200" width="32" height="32" rx="8" fill="#27272A"/>
  
  <!-- Top Intelligence Bar -->
  <rect x="64" y="0" width="1136" height="56" fill="#0A0A0A" stroke="#27272A" stroke-width="1"/>
  <text x="84" y="34" fill="#EDEDED" font-family="sans-serif" font-size="14" font-weight="600">INTELAGENT 3.0</text>
  
  <!-- Persona Chip -->
  <rect x="450" y="12" width="300" height="32" rx="16" fill="#141415" stroke="#b8975a" stroke-width="1"/>
  <circle cx="466" cy="28" r="8" fill="#6B8E7B"/>
  <text x="482" y="33" fill="#EDEDED" font-family="sans-serif" font-size="12">Persona: Alejandro (Director de Marketing)</text>
  <text x="700" y="33" fill="#6B8E7B" font-family="sans-serif" font-size="12" font-weight="bold">95%</text>
  
  <!-- Main Workspace (Full Screen Matrix) -->
  
  <!-- Left Column: Scenario Definition -->
  <rect x="84" y="80" width="340" height="680" rx="16" fill="#141415" stroke="#27272A" stroke-width="1"/>
  <text x="104" y="110" fill="#b8975a" font-family="sans-serif" font-size="12" font-weight="bold">SCENARIO DEFINITION</text>
  <rect x="104" y="130" width="300" height="80" rx="8" fill="#0A0A0A" stroke="#27272A"/>
  <text x="114" y="155" fill="#A1A1AA" font-family="sans-serif" font-size="12">"Lanzar maestría en Innovación..."</text>
  
  <rect x="104" y="230" width="300" height="40" rx="8" fill="#b8975a"/>
  <text x="210" y="255" fill="#0A0A0A" font-family="sans-serif" font-size="14" font-weight="bold">STRESS TEST</text>
  
  <!-- Right Column: Intelligence Matrix -->
  <rect x="444" y="80" width="736" height="680" rx="16" fill="#141415" stroke="#27272A" stroke-width="1"/>
  <text x="464" y="110" fill="#b8975a" font-family="sans-serif" font-size="12" font-weight="bold">INTELLIGENCE MATRIX</text>
  
  <!-- Insight Grid -->
  <rect x="464" y="130" width="340" height="180" rx="16" fill="#0A0A0A" stroke="#27272A"/>
  <text x="480" y="160" fill="#EDEDED" font-family="sans-serif" font-size="14" font-weight="bold">Strategic Fit</text>
  <rect x="480" y="180" width="308" height="8" rx="4" fill="#27272A"/>
  <rect x="480" y="180" width="220" height="8" rx="4" fill="#6B8E7B"/>
  
  <rect x="820" y="130" width="340" height="180" rx="16" fill="#0A0A0A" stroke="#27272A"/>
  <text x="836" y="160" fill="#EDEDED" font-family="sans-serif" font-size="14" font-weight="bold">Conversion Probability</text>
  <circle cx="990" cy="220" r="40" fill="none" stroke="#27272A" stroke-width="8"/>
  <circle cx="990" cy="220" r="40" fill="none" stroke="#b8975a" stroke-width="8" stroke-dasharray="180 251"/>
  <text x="975" y="225" fill="#EDEDED" font-family="sans-serif" font-size="18" font-weight="bold">72%</text>
  
  <rect x="464" y="330" width="696" height="410" rx="16" fill="#0A0A0A" stroke="#27272A"/>
  <text x="480" y="360" fill="#EDEDED" font-family="sans-serif" font-size="14" font-weight="bold">Persona Narrative Breakdown</text>
  <rect x="480" y="380" width="664" height="1" fill="#27272A"/>
  <text x="480" y="410" fill="#A1A1AA" font-family="sans-serif" font-size="13">"El segmento posgrado ABC+ en CDMX muestra alta sensibilidad..."</text>
  
  <!-- Branding Footer (Small) -->
  <text x="1100" y="785" fill="#475569" font-family="sans-serif" font-size="10">BERUMEN © 2026</text>
